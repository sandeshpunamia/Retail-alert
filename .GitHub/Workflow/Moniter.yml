name: Reliance regulatory monitor

on:
  schedule:
    - cron: "10 * * * *"
    - cron: "40 3,7,11,15 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Send digest now?"
        default: "true"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "40 3,7,11,15 * * *" ] || [ "${{ github.event.inputs.digest }}" = "true" ]; then
            python monitor.py --digest
          else
            python monitor.py
          fi
      - name: Save state
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
